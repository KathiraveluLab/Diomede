      interval: 10s
      timeout: 5s
      retries: 3

  # Orchestrator: Redis, Telemetry Daemon and FastAPI, each in its own container
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - diomede-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  telemetry-daemon:
    build:
      context: .
      dockerfile: ./config/orchestrator/Dockerfile
    container_name: telemetry-daemon
    entrypoint: ["python3", "-m", "src.orchestrator.daemon"]
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      orthanc-us:
        condition: service_healthy
      orthanc-eu:
        condition: service_healthy
      orthanc-asia:
        condition: service_healthy
      orthanc-af:
        condition: service_healthy
    networks:
      - diomede-net

  orchestrator:
    build:
      context: .
      dockerfile: ./config/orchestrator/Dockerfile
    container_name: orchestrator
    ports:
      - "${ORCHESTRATOR_HTTPS_PORT}:${ORCHESTRATOR_PORT}"
      # - "${REDIS_PORT}:${REDIS_PORT}"
    # All runtime config (REDIS_URL, DAEMON_POLL_INTERVAL_S, scoring weights,
    # NODE_*_BASE/USER/PASS, REQUESTS_CA_BUNDLE, ...) comes from .env via
    # env_file below.
    env_file: .env

    volumes:
      - ./certs/orchestrator/server.crt:/certs/server.crt:ro
      - ./certs/orchestrator/server.key:/certs/server.key:ro
      - ./certs/ca.pem:/certs/ca.pem:ro

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - diomede-net
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import urllib.request, ssl, sys
          ctx = ssl.create_default_context(cafile='/certs/ca.pem')
          try:
            urllib.request.urlopen('https://localhost:8000/health', context=ctx, timeout=5)
            sys.exit(0)
          except Exception:
            sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 3

  # Edge Agent: Edge Orthanc + Forwarder Daemon
  agent-001:
    build:
      context: .
      dockerfile: ./config/edge/Dockerfile
    container_name: agent-001
    ports:
      - "${EDGE_AGENT1_HTTPS_PORT}:${ORTHANC_HTTPS_PORT}"  # Edge Orthanc REST API
      - "${EDGE_AGENT1_DICOM_PORT}:${ORTHANC_DICOM_PORT}"  # Edge Orthanc DICOM
    env_file: .env
    volumes:
      - ./config/orthanc/edge.template.json:/etc/orthanc/orthanc.template.json:ro
      - ./certs/agent-001:/etc/orthanc/certs:ro
      - ./certs/ca.pem:/certs/ca.pem:ro
      - orthanc-edge-data:/var/lib/orthanc/db
    environment:
      # EDGE_USER/PASS, NODE_*_BASE/USER/PASS, ORCHESTRATOR_API_KEY,
      # FORWARDER_POLL_INTERVAL_S, PROBE_INTERVAL_S, and REQUESTS_CA_BUNDLE
      # come from .env via env_file above. Only names that differ from
      # their .env property key, or that are composed from one, need an
      # explicit mapping here:

      # This container's own co-located Orthanc.
      EDGE_BASE: "${NODE_INT_BASE}"

      # Property key is EDGE_AGENT1; the forwarder code expects AGENT_ID.
      AGENT_ID: "${EDGE_AGENT1}"

      # Orchestrator connection.
      ORCH_URL: "${ORCHESTRATOR_BASE}/get-best-node"
      ORCH_HEARTBEAT_URL: "${ORCHESTRATOR_BASE}/heartbeat"
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE}

    depends_on:
      orchestrator:
        condition: service_healthy

    networks:
      - diomede-net
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import urllib.request, ssl, base64, os
          ctx = ssl.create_default_context(cafile='/etc/orthanc/certs/ca.pem')
          r = urllib.request.Request('https://localhost:8042/system')
          r.add_header('Authorization', 'Basic ' + base64.b64encode(
              (os.environ['ORTHANC_USER'] + ':' + os.environ['ORTHANC_PASSWORD']).encode()
          ).decode())
          with urllib.request.urlopen(r, context=ctx, timeout=5) as response: pass
      interval: 10s
      timeout: 5s
      retries: 3
