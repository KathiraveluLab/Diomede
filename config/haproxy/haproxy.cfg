global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    option httpchk GET /system HTTP/1.1
    http-check send hdr Host localhost hdr Authorization "Basic b3J0aGFuYzpvcnRoYW5j"
    http-check expect status 200

frontend orthanc_https_in
    bind *:8049 ssl crt /certs/combined.pem
    default_backend orthanc_cloud_pool

backend orthanc_cloud_pool
    balance leastconn
    option redispatch
    retries 2
    default-server inter 5s fall 2 rise 2 ssl verify required ca-file /certs/ca.pem
    server us-east1 orthanc-us:8042 check
    server eu-west1 orthanc-eu:8042 check
    server asia-northeast1 orthanc-asia:8042 check
    server af-south1 orthanc-af:8042 check
